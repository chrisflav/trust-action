# A library's index is only useful if it tracks the library, so generating it
# belongs in the library's CI rather than in a person's terminal.  This is that
# step, packaged: fetch and build `trust`, run `trust export` inside the
# caller's repository, and hand back the directory.
#
# This action lives apart from the exporter it drives because the two are
# versioned by different things.  `trust` is versioned by Lean: it reads
# `.olean` files, which only the Lean that wrote them can read, so there is one
# release per toolchain and the caller's `lean-toolchain` decides which.  The
# action is versioned by its own inputs and outputs, which change when someone
# wants a new one and not when Lean moves.  Held in one repository, a caller
# had to name a single ref for both, and every Lean bump downstream became an
# edit to a `uses:` line that had nothing to say about it.
#
# What that costs is the guarantee the arrangement used to give for free: the
# action and the exporter are no longer the same commit, so this file can find
# itself driving a `trust` written before or after it.  The compatibility
# surface is small and named — the export flags passed below, and the
# `meta.json` fields the report step reads — and `meta.json` carries
# `schemaVersion` for the case where it is not enough.
#
# Composite rather than JavaScript: every step here is a shell command or an
# existing action, and a JavaScript action would mean a committed `dist/` bundle
# that has to be rebuilt — and can silently disagree with the source it was
# built from — for no behaviour that `run:` cannot express.
name: 'Generate a trust index'
description: >-
  Export a Lean library as a static trust index: the definitional dependency
  graph the trust web UI and CLI read.
author: 'chrisflav'

branding:
  icon: 'git-merge'
  color: 'purple'

inputs:
  module:
    description: >-
      The root module to export, e.g. `Mathlib` or `Init`.  Its whole import
      closure is indexed.  One module only: `trust export` writes one index per
      import closure under one `--repo` name, and the frontend selects an index
      by that name, so a library with several unrelated roots wants several runs
      of this action with different `index-name`s.
    required: true
  index-name:
    description: >-
      Name of the index, used as the output subdirectory and as the `?repo=`
      value the frontend selects it by.  Defaults to this repository's name.
    required: false
    default: ''
  output-dir:
    description: >-
      Directory to write the index into; the index itself lands in
      `<output-dir>/<index-name>`.  Relative paths are taken from the workspace
      root, not from `working-directory`.
    required: false
    default: 'trust-index'
  working-directory:
    description: >-
      The Lake package to export, relative to the workspace root.  The export
      runs inside it via `lake env`, so its `.olean` files are what gets
      indexed.
    required: false
    default: '.'
  with-bodies:
    description: >-
      Export the edges that come from definition bodies.  Without them
      definitions do not unfold in the UI, which is most of what it is for.
      Proof terms are never exported, with or without this.
    required: false
    default: 'true'
  with-code:
    description: >-
      Export rendered, clickable declaration source.  This is the largest part
      of an index by far — 25 MB of Lean core's 40 MB — but without it the UI
      shows names and no statements.
    required: false
    default: 'true'
  with-hashes:
    description: >-
      Record each declaration's semantic hash, so the index can be matched
      against trust certificates and against the snapshots `trust check` reads.

      On by default, because a hash is only useful if it was there beforehand:
      the question it answers is whether a declaration is the one it was at some
      earlier commit, and an index exported without hashes cannot be given them
      afterwards.  The cost is a pass over the whole environment — a further
      minute for Lean core, more for a library on top of Mathlib, and the same
      either way whether or not `module-filter` narrows what is exported, since
      the pass is over the environment rather than over the selection.  Turn it
      off for an index that only has to be read.
    required: false
    default: 'true'
  fast-prop:
    description: >-
      Treat exactly the theorems as proofs instead of asking `MetaM`.  Faster,
      and wrong for a definition whose type happens to be a `Prop`.
    required: false
    default: 'false'
  module-filter:
    description: >-
      Restrict the exported declarations to matching modules, as a
      comma-separated list of aftk patterns (`A.B.C`, `A.B.*`, `*`).  Empty
      means every module in the import closure, including the dependencies'.
    required: false
    default: ''
  marks:
    description: >-
      Marks file to carry into the index, relative to `working-directory`.
      Empty leaves `trust export` to its default of `trust-marks.json` there —
      note that this is the *indexed* repository's file, not trust's.
    required: false
    default: ''
  rev:
    description: >-
      Revision to record in `meta.json`.  Empty lets `trust` read it from git in
      the checked-out repository, which is right for nearly everything; set it
      when the checkout is not the commit you mean, as for a pull request, whose
      checked-out commit is a merge that exists nowhere else.
    required: false
    default: ''
  build-library:
    description: >-
      Build the library before exporting it.  The export reads `.olean` files,
      so something has to have built them; turn this off only if an earlier step
      in your job already did.
    required: false
    default: 'true'
  trust-ref:
    description: >-
      Which `trust` to build.  `auto`, the default, selects the release built
      for the Lean this repository pins: it reads `working-directory`'s
      `lean-toolchain` and takes the trust tag of that name, so a library that
      bumps Lean keeps indexing without also editing its `uses:` line.  Empty
      means the same thing.

      Any other value is a ref in `chrisflav/trust` — a tag, a branch or a
      commit — for pinning an exporter exactly, or for testing one that has not
      been released.  Note that an exporter can only read the `.olean` files of
      the Lean it was built on, so a ref that names a different toolchain than
      this repository is a failure either way; it just fails sooner and more
      clearly with `require-matching-toolchain`.
    required: false
    default: 'auto'
  require-matching-toolchain:
    description: >-
      Fail when this repository and `trust` name different Lean toolchains.
      Turn it off only when you know the two files name the same Lean by
      different strings; see the note in the README about why there is no option
      to build `trust` on your toolchain instead.
    required: false
    default: 'true'
  cache:
    description: >-
      Cache the built `trust` binary between runs, keyed on a hash of its
      sources and the toolchain.
    required: false
    default: 'true'
  publish:
    description: >-
      Where to publish the index so that a browser can read it.  `false`, the
      default, publishes nothing and leaves the directory for the caller to
      upload as an artifact.  `branch` force-pushes it to `publish-branch` of
      this repository, where `raw.githubusercontent.com` serves it.

      A branch rather than the workflow artifact, because an artifact is not
      readable by a browser: downloading one requires a token with the `repo`
      scope even when the repository is public, so a frontend reading artifacts
      would have to ask every reader for full control of their private
      repositories in order to show them a public dependency graph.  A branch is
      anonymous, is served with `Access-Control-Allow-Origin: *` and gzip, and
      does not expire after thirty days as an artifact does.

      What it costs is repository size — an index is hundreds of megabytes
      unpacked — which is why the branch is orphaned and force-pushed rather
      than added to: it stays one commit deep, and the objects it replaces fall
      unreferenced.  Needs `permissions: contents: write` in the calling job.
    required: false
    default: 'false'
  publish-branch:
    description: >-
      The branch `publish: branch` writes to.  The default is what the frontend
      looks for when given only a repository, so changing it means readers have
      to be told the branch as well.
    required: false
    default: 'trust-index'

outputs:
  index-path:
    description: 'The generated index directory, the one containing meta.json.'
    value: ${{ steps.resolve.outputs.index-path }}
  index-root:
    description: >-
      The directory holding the index directory — what to copy to
      `web/public/index`, since the frontend expects `<root>/<name>/meta.json`.
    value: ${{ steps.resolve.outputs.index-root }}
  index-name:
    description: 'The name the index was written under, i.e. the `?repo=` value.'
    value: ${{ steps.resolve.outputs.index-name }}
  rev:
    description: 'The revision recorded in the index, as meta.json reports it.'
    value: ${{ steps.report.outputs.rev }}
  decl-count:
    description: 'How many declarations the index holds.'
    value: ${{ steps.report.outputs.decl-count }}
  index-url:
    description: >-
      Where the published index is readable, when `publish` wrote one; empty
      otherwise.  This is the base a frontend fetches `meta.json` from.
    value: ${{ steps.publish.outputs.index-url }}
  trust-bin:
    description: >-
      The `trust` binary that was built, so a later step can run `trust check`
      or `trust cert issue` without building it a second time.
    value: ${{ steps.build-trust.outputs.trust-bin }}

runs:
  using: composite
  steps:
    # Everything user-supplied is validated once, here, and every later step
    # reads the results rather than the inputs.  Two reasons: a typo like
    # `with-code: yes` would otherwise be silently read as false and produce an
    # index missing a quarter of itself, and the flag string the exporter is
    # invoked with is then built from a fixed vocabulary rather than from
    # anything a caller wrote.
    - name: Check the inputs and resolve the defaults
      id: resolve
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        INDEX_NAME: ${{ inputs.index-name }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        WITH_BODIES: ${{ inputs.with-bodies }}
        WITH_CODE: ${{ inputs.with-code }}
        WITH_HASHES: ${{ inputs.with-hashes }}
        FAST_PROP: ${{ inputs.fast-prop }}
        BUILD_LIBRARY: ${{ inputs.build-library }}
        REQUIRE_MATCHING_TOOLCHAIN: ${{ inputs.require-matching-toolchain }}
        CACHE: ${{ inputs.cache }}
        PUBLISH: ${{ inputs.publish }}
        PUBLISH_BRANCH: ${{ inputs.publish-branch }}
        TRUST_REF: ${{ inputs.trust-ref }}
        # The repository `trust-ref` names a ref in, and the one `auto` looks
        # for release tags in.  A constant rather than an input: the checkout
        # step below can only fetch this repository anyway.
        TRUST_REPO: 'https://github.com/chrisflav/trust'
      run: |
        set -euo pipefail

        # `true`/`false` as strings is all an action input can be, so the check
        # has to be explicit; anything else is a mistake rather than a false.
        check_bool () {
          case "$2" in
            true|false) ;;
            *) echo "::error::input \`$1\` must be 'true' or 'false', not '$2'"; exit 1 ;;
          esac
        }
        # These end up in $GITHUB_OUTPUT as `name=value` lines, which a newline
        # would turn into a second, attacker-chosen output.
        reject_newlines () {
          if [ "$(printf '%s' "$2" | wc -l)" -ne 0 ]; then
            echo "::error::input \`$1\` must not contain a newline"; exit 1
          fi
        }

        check_bool with-bodies "$WITH_BODIES"
        check_bool with-code "$WITH_CODE"
        check_bool with-hashes "$WITH_HASHES"
        check_bool fast-prop "$FAST_PROP"
        check_bool build-library "$BUILD_LIBRARY"
        check_bool require-matching-toolchain "$REQUIRE_MATCHING_TOOLCHAIN"
        check_bool cache "$CACHE"
        reject_newlines module "$MODULE"
        reject_newlines index-name "$INDEX_NAME"
        reject_newlines output-dir "$OUTPUT_DIR"
        reject_newlines working-directory "$WORKING_DIRECTORY"

        # Not a boolean: `false` is a destination like any other, and leaving
        # room for a second one is cheaper than changing the type later.
        case "$PUBLISH" in
          false|branch) ;;
          true)
            echo "::error::input \`publish\` names a destination, not a flag: use 'branch' rather than 'true'"
            exit 1 ;;
          *) echo "::error::input \`publish\` must be 'false' or 'branch', not '$PUBLISH'"; exit 1 ;;
        esac
        # It becomes a ref name and a path segment of a raw.githubusercontent
        # URL, so the same vocabulary as `index-name` — which also rules out the
        # leading dash, the `..` and the other things git refuses in a ref.
        case "$PUBLISH_BRANCH" in
          *[!A-Za-z0-9._/-]*|''|.|..|-*|/*|*/)
            echo "::error::\`publish-branch\` must be a plain branch name: '$PUBLISH_BRANCH'"
            exit 1 ;;
        esac

        # A module name with a space in it is two arguments to the exporter, and
        # one starting with `-` is an option; both fail obscurely much later.
        case "$MODULE" in
          '') echo "::error::input \`module\` is required"; exit 1 ;;
          -*) echo "::error::\`module\` must be a module name, not an option: '$MODULE'"; exit 1 ;;
          *[[:space:]]*)
            echo "::error::\`module\` takes one module, not '$MODULE'.  An index is one import closure; use the action once per root module, with a different \`index-name\` each time."
            exit 1 ;;
        esac

        # The repository name, because an index is nearly always *of* a
        # repository and naming it twice is a thing to get wrong.  Resolved here
        # rather than as an input default: expression contexts in action input
        # defaults are not something to rely on, and $GITHUB_REPOSITORY always
        # exists.
        if [ -z "$INDEX_NAME" ]; then
          INDEX_NAME="${GITHUB_REPOSITORY##*/}"
        fi
        # It becomes a directory name and a URL parameter.
        case "$INDEX_NAME" in
          *[!A-Za-z0-9._-]*|''|.|..|-*)
            echo "::error::\`index-name\` must be a plain name of letters, digits, dot, dash or underscore: '$INDEX_NAME'"
            exit 1 ;;
        esac

        # The exporter runs with the target repository as its working directory,
        # so a relative --out would land inside the library being indexed.
        # Anchoring on the workspace instead makes `output-dir` mean the same
        # thing whatever `working-directory` is.
        case "$OUTPUT_DIR" in
          /*) ;;
          *) OUTPUT_DIR="$GITHUB_WORKSPACE/$OUTPUT_DIR" ;;
        esac
        case "$WORKING_DIRECTORY" in
          /*) ;;
          *) WORKING_DIRECTORY="$GITHUB_WORKSPACE/$WORKING_DIRECTORY" ;;
        esac
        if [ ! -d "$WORKING_DIRECTORY" ]; then
          echo "::error::no such directory '$WORKING_DIRECTORY'.  Has the repository been checked out?"
          exit 1
        fi
        WORKING_DIRECTORY="$(cd "$WORKING_DIRECTORY" && pwd -P)"

        # `auto` lets the caller's toolchain choose the exporter.  A trust
        # release is a release *for* a Lean — the exporter reads `.olean` files,
        # so there is exactly one trust per toolchain — and each tag is named
        # after the Lean it indexes.  That makes the caller's `lean-toolchain`
        # the entire mapping: no table here to fall out of date, and a Lean with
        # no trust yet is a tag that does not resolve rather than a lookup that
        # silently returns nothing.
        CHECKOUT_REF=""
        if [ -z "$TRUST_REF" ]; then TRUST_REF=auto; fi
        if [ "$TRUST_REF" = auto ]; then
          if [ ! -f "$WORKING_DIRECTORY/lean-toolchain" ]; then
            echo "::error::no lean-toolchain in '$WORKING_DIRECTORY', so there is no toolchain to select a trust for"
            exit 1
          fi
          TOOLCHAIN="$(tr -d '[:space:]' < "$WORKING_DIRECTORY/lean-toolchain")"
          # `leanprover/lean4:v4.32.0`, and the tag is what follows the colon.
          WANT="${TOOLCHAIN##*:}"
          case "$WANT" in
            v[0-9]*) ;;
            *)
              echo "::error::cannot read a Lean version out of '$TOOLCHAIN'; pass \`trust-ref\` explicitly"
              exit 1 ;;
          esac
          # Resolved to the commit the tag points at rather than checked out by
          # name: a tag can be moved, and the build cache is keyed on the sources
          # a run actually got, so a moved tag would otherwise be served an
          # earlier tag's binary for ever.  `^{}` dereferences the tag object,
          # which is what an annotated tag needs and a lightweight one ignores.
          SHA="$(git ls-remote "$TRUST_REPO" "refs/tags/$WANT^{}" | cut -f1)"
          if [ -z "$SHA" ]; then
            SHA="$(git ls-remote "$TRUST_REPO" "refs/tags/$WANT" | cut -f1)"
          fi
          if [ -z "$SHA" ]; then
            RELEASED="$(git ls-remote --tags "$TRUST_REPO" \
              | sed -n 's|.*refs/tags/||p' | grep -v '\^{}$' | sort -V | tr '\n' ' ')"
            echo "::error::no trust release for Lean $WANT.  Released: ${RELEASED:-none}"
            exit 1
          fi
          echo "trust for Lean $WANT: $SHA" >&2
          CHECKOUT_REF="$SHA"
        elif [ -n "$TRUST_REF" ]; then
          CHECKOUT_REF="$TRUST_REF"
        fi

        # The exporter is always fetched — this repository holds the action and
        # not the Lean code it drives — so it lands beside the caller's
        # checkout rather than inside it, where a `lake build` of the library
        # would otherwise find it.
        TRUST_SRC="$GITHUB_WORKSPACE/.trust-source"
        mkdir -p "$TRUST_SRC"
        # Resolved rather than used as written: `actions/cache` refuses a path
        # containing a `/.` segment — as a warning in its post step, so the
        # cache silently stores nothing and every run rebuilds trust from
        # scratch.  It also keeps the `trust-bin` output a path a caller can
        # print.
        TRUST_SRC="$(cd "$TRUST_SRC" && pwd -P)"

        FLAGS=""
        if [ "$WITH_BODIES" = true ]; then FLAGS="$FLAGS --with-bodies"; fi
        if [ "$WITH_CODE" = true ]; then FLAGS="$FLAGS --with-code"; fi
        if [ "$WITH_HASHES" = true ]; then FLAGS="$FLAGS --with-hashes"; fi
        if [ "$FAST_PROP" = true ]; then FLAGS="$FLAGS --fast-prop"; fi

        {
          echo "index-name=$INDEX_NAME"
          echo "index-root=$OUTPUT_DIR"
          echo "index-path=$OUTPUT_DIR/$INDEX_NAME"
          echo "work-dir=$WORKING_DIRECTORY"
          echo "trust-src=$TRUST_SRC"
          echo "checkout-ref=$CHECKOUT_REF"
          echo "export-flags=$FLAGS"
          echo "publish=$PUBLISH"
          echo "publish-branch=$PUBLISH_BRANCH"
        } >> "$GITHUB_OUTPUT"

    # Unconditional: `resolve` either produced a ref or failed, so a skipped
    # checkout here could only leave an empty directory for `lake build` to
    # fail in for reasons that read like anything but a missing checkout.
    - name: Check out trust
      uses: actions/checkout@v5
      with:
        repository: chrisflav/trust
        ref: ${{ steps.resolve.outputs.checkout-ref }}
        path: .trust-source

    # `.olean` files can only be read by the exact Lean that wrote them, so a
    # toolchain mismatch is fatal — but it fails somewhere inside Lean, with an
    # error about a module header rather than about versions.  Better to say it
    # here, naming both files, than to let a maintainer read a stack trace.
    #
    # There is deliberately no option to build `trust` on *your* toolchain
    # instead: trust's source only compiles against the Lean it pins, since the
    # metaprogramming API it uses moves every release, so that option would trade
    # this clear failure for a compile error deep in someone else's code.  The
    # escape hatch that does exist is for the other case — two files naming the
    # same Lean differently, which elan accepts and a string comparison does not.
    #
    # Under `trust-ref: auto` the two agree by construction, since the tag was
    # chosen from this file.  The check stays anyway: what it then catches is a
    # release tagged for a Lean it was not built on, which is the one way the
    # naming convention `auto` relies on can be wrong.
    - name: Check that trust and this library agree on a toolchain
      id: toolchain
      shell: bash
      env:
        TRUST_SRC: ${{ steps.resolve.outputs.trust-src }}
        WORK_DIR: ${{ steps.resolve.outputs.work-dir }}
        REQUIRE_MATCHING_TOOLCHAIN: ${{ inputs.require-matching-toolchain }}
      run: |
        set -euo pipefail

        # The annotation goes to stderr because this runs inside a command
        # substitution, which would otherwise capture it as the toolchain: a
        # package with no `lean-toolchain` of its own — a monorepo subdirectory,
        # say — would fail this step with nothing in the log but an exit code,
        # from the one step whose whole purpose is to say what went wrong.
        read_toolchain () {
          if [ ! -f "$1/lean-toolchain" ]; then
            echo "::error::no lean-toolchain in '$1'" >&2
            exit 1
          fi
          tr -d '[:space:]' < "$1/lean-toolchain"
        }
        THEIRS="$(read_toolchain "$WORK_DIR")"
        OURS="$(read_toolchain "$TRUST_SRC")"

        if [ "$THEIRS" != "$OURS" ]; then
          echo "this library: $THEIRS  ($WORK_DIR/lean-toolchain)" >&2
          echo "trust:        $OURS  ($TRUST_SRC/lean-toolchain)" >&2
          echo "trust reads .olean files, which only the Lean version that wrote them can read." >&2
          echo "Either wait for trust to be bumped to $THEIRS, or pin this workflow to a trust ref on it." >&2
          if [ "$REQUIRE_MATCHING_TOOLCHAIN" = true ]; then
            echo "::error::Lean toolchain mismatch: this library is on $THEIRS, trust is on $OURS"
            exit 1
          fi
          echo "::warning::Lean toolchain mismatch ($THEIRS vs $OURS), continuing because require-matching-toolchain is false"
        fi

        # The cache key is a hash of the sources the binary is built from, not a
        # ref: `trust-ref: main` is a moving target, and a key that does not move
        # with it would serve yesterday's binary for ever.  Nothing here is
        # allowed to be missing — a silently empty file list would hash to the
        # same thing for every possible source tree.
        sha256_stdin () {
          if command -v sha256sum > /dev/null; then sha256sum; else shasum -a 256; fi
        }
        # Names as well as contents: two files swapping their contents is a
        # different binary, and hashing the concatenation alone would not see it.
        SOURCE_HASH="$(cd "$TRUST_SRC" \
          && find Trust Trust.lean Main.lean lakefile.toml lake-manifest.json lean-toolchain -type f -print0 \
          | LC_ALL=C sort -z \
          | while IFS= read -r -d '' f; do printf '%s\0' "$f"; cat "$f"; done \
          | sha256_stdin | cut -d' ' -f1)"

        {
          # `:` and `/` are legal in a cache key but make one hard to read in a
          # log; the slug is only ever used as a key fragment.
          echo "toolchain-slug=$(printf '%s' "$OURS" | tr -c 'A-Za-z0-9._-' '-')"
          echo "source-hash=$SOURCE_HASH"
        } >> "$GITHUB_OUTPUT"

    # elan, the toolchain, and — when asked — the library itself.  lean-action
    # rather than a hand-rolled elan install because it also knows about the
    # Mathlib build cache, without which indexing a Mathlib-based library would
    # start by compiling Mathlib.
    - name: Set up Lean and build the library
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: ${{ inputs.working-directory }}
        build: ${{ inputs.build-library }}
        test: false
        lint: false

    # Exact key, no `restore-keys`: a near-miss restore is a binary built from
    # some other version of these sources, which would then export a library
    # under a name and a schema that no longer match.  `lake build` still runs
    # after a hit, so even a partial cache from a failed run is completed rather
    # than trusted.
    - name: Restore the trust build
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.resolve.outputs.trust-src }}/.lake/build
          ${{ steps.resolve.outputs.trust-src }}/.lake/packages
        key: trust-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.toolchain-slug }}-${{ steps.toolchain.outputs.source-hash }}

    - name: Build trust
      id: build-trust
      shell: bash
      env:
        TRUST_SRC: ${{ steps.resolve.outputs.trust-src }}
      run: |
        set -euo pipefail
        cd "$TRUST_SRC"
        lake build
        BIN="$TRUST_SRC/.lake/build/bin/trust"
        if [ ! -x "$BIN" ]; then
          echo "::error::lake build produced no binary at $BIN"
          exit 1
        fi
        echo "trust-bin=$BIN" >> "$GITHUB_OUTPUT"

    # `lake env` is what puts the library's oleans on LEAN_PATH, and it only
    # does so from inside the package, which is why this runs there rather than
    # passing a path.
    - name: Export the index
      id: export
      shell: bash
      env:
        TRUST_BIN: ${{ steps.build-trust.outputs.trust-bin }}
        WORK_DIR: ${{ steps.resolve.outputs.work-dir }}
        INDEX_NAME: ${{ steps.resolve.outputs.index-name }}
        INDEX_ROOT: ${{ steps.resolve.outputs.index-root }}
        EXPORT_FLAGS: ${{ steps.resolve.outputs.export-flags }}
        MODULE: ${{ inputs.module }}
        MODULE_FILTER: ${{ inputs.module-filter }}
        MARKS: ${{ inputs.marks }}
        REV: ${{ inputs.rev }}
      run: |
        set -euo pipefail
        cd "$WORK_DIR"
        mkdir -p "$INDEX_ROOT"

        args=(export --repo "$INDEX_NAME" --out "$INDEX_ROOT")
        # Unquoted on purpose, and the only place that is: these words were
        # assembled from a fixed set of literals in `resolve`, never from input
        # text.  Everything below is a caller's string and stays one argument.
        args+=($EXPORT_FLAGS)
        if [ -n "$MODULE_FILTER" ]; then args+=(--module "$MODULE_FILTER"); fi
        if [ -n "$MARKS" ]; then args+=(--marks "$MARKS"); fi
        if [ -n "$REV" ]; then args+=(--rev "$REV"); fi
        args+=("$MODULE")

        lake env "$TRUST_BIN" "${args[@]}"

    - name: Report what was written
      id: report
      shell: bash
      env:
        INDEX_PATH: ${{ steps.resolve.outputs.index-path }}
        INDEX_NAME: ${{ steps.resolve.outputs.index-name }}
      run: |
        set -euo pipefail
        META="$INDEX_PATH/meta.json"
        if [ ! -f "$META" ]; then
          echo "::error::the export wrote no $META"
          exit 1
        fi

        # meta.json is the index's own account of itself, so the outputs are
        # read back from it rather than guessed at from the inputs: what the
        # caller is told is then what a reader of the index will see.
        field () { sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" "$META" | head -1; }
        number () { sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\\([0-9][0-9]*\\).*/\\1/p" "$META" | head -1; }

        REV="$(field rev)"
        DECL_COUNT="$(number declCount)"
        STMT_EDGES="$(number stmtEdgeCount)"
        BODY_EDGES="$(number bodyEdgeCount)"

        # Not fatal: an index without a revision is still a usable index, it
        # just cannot be tied to a commit.  git declines to answer in a checkout
        # it considers unsafe to own, which is the likely cause and is worth
        # naming.
        if [ -z "$REV" ]; then
          echo "::warning::the index records no revision: git in the exported package answered nothing.  Pass the \`rev\` input to record one."
        fi

        {
          echo "rev=$REV"
          echo "decl-count=$DECL_COUNT"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### trust index \`$INDEX_NAME\`"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| declarations | $DECL_COUNT |"
          echo "| statement edges | $STMT_EDGES |"
          echo "| body edges | $BODY_EDGES |"
          echo "| revision | \`${REV:-unknown}\` |"
          echo "| size | $(du -sh "$INDEX_PATH" | cut -f1) |"
        } >> "$GITHUB_STEP_SUMMARY"

    # Push the index where a browser can read it.  `raw.githubusercontent.com`
    # serves a branch anonymously, with CORS and gzip, which is the whole
    # requirement — see the `publish` input for why not the artifact.
    - name: Publish the index
      id: publish
      if: steps.resolve.outputs.publish == 'branch'
      shell: bash
      env:
        INDEX_ROOT: ${{ steps.resolve.outputs.index-root }}
        INDEX_NAME: ${{ steps.resolve.outputs.index-name }}
        BRANCH: ${{ steps.resolve.outputs.publish-branch }}
        REV: ${{ steps.report.outputs.rev }}
        # Composite actions get the job's token, so publishing to this
        # repository needs no secret of its own — only `permissions:
        # contents: write` on the job, which is why the failure below says so.
        TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$INDEX_ROOT"

        # git refuses blobs over 100 MB, and the push would fail after however
        # long it takes to send everything before it.  `decls.jsonl` is the file
        # that grows with the library, so this is a real ceiling rather than a
        # theoretical one, and it is worth naming before the upload rather than
        # after.
        TOO_BIG="$(find . -type f -size +100M -printf '%p (%s bytes)\n' || true)"
        if [ -n "$TOO_BIG" ]; then
          echo "::error::these files exceed GitHub's 100 MB limit, so the index cannot be published to a branch:"
          printf '%s\n' "$TOO_BIG"
          echo "::error::export a smaller index — \`with-code: false\` drops the largest part — or host it elsewhere"
          exit 1
        fi

        # A repository of its own, made fresh: the index is a snapshot rather
        # than a history, and an orphan force-pushed each run keeps the branch
        # one commit deep.  Anything else accumulates hundreds of megabytes per
        # run in a repository people clone for its mathematics.
        rm -rf .git
        git init -q
        git checkout -q --orphan "$BRANCH"
        # 20 MB of packed edge pairs must not be run through end-of-line
        # conversion by a reader who has `core.autocrlf` set.
        printf '* -text\n' > .gitattributes
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        git commit -q -m "trust index of ${REV:-$GITHUB_SHA}"

        # The token is masked in logs, but keeping it out of them entirely is
        # cheaper than relying on that.
        if ! git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH" 2>/dev/null; then
          echo "::error::could not push to \`$BRANCH\`.  A job that publishes needs \`permissions: contents: write\`."
          exit 1
        fi

        URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BRANCH/$INDEX_NAME"
        echo "index-url=$URL" >> "$GITHUB_OUTPUT"

        {
          echo
          echo "Published to [\`$BRANCH\`](https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH), readable at"
          echo "[\`$URL/meta.json\`]($URL/meta.json) — open \`?gh=$GITHUB_REPOSITORY\` in a trust frontend."
        } >> "$GITHUB_STEP_SUMMARY"
